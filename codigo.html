<!-- Inicio do código -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Cell - Celulares Importados</title>
<script src="https://cdn.tailwindcss.com"></script>

	<!-- CSS -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap');

:root {
--blue: #00bfff;
--pink: #ff69b4;
}

* { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
body { font-family: 'Inter', system_ui, sans-serif; }

.product-card:hover {
    transform: translateY(-12px);
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
}

.color-circle {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 3px solid #fff; box-shadow: 0 0 0 4px #e5e7eb;
}
.color-circle.selected {
    border: 3px solid #00bfff; box-shadow: 0 0 0 6px #bae6fd; transform: scale(1.12);
}
.storage-btn.active {
    background-color: #00bfff; color: white; border-color: #00bfff; transform: scale(1.05);
}
</style>
</head>
<body class="bg-slate-50">

<!-- HEADER -->
<header class="bg-white shadow-sm sticky top-0 z-50">
<div class="w-full px-4 sm:px-6 py-5 flex justify-between items-center max-w-screen-2xl mx-auto">
    <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-gradient-to-br from-[#00bfff] to-[#ff69b4] rounded-3xl flex items-center justify-center text-3xl shadow">📱</div>
        <h1 class="text-3xl font-bold tracking-tighter bg-gradient-to-r from-[#00bfff] to-[#ff69b4] bg-clip-text text-transparent">Import Cell</h1>
    </div>
    <div class="flex items-center gap-6">
        <button onclick="showAuthModal()" id="auth-button" class="flex items-center gap-2 text-lg hover:text-[#00bfff]">Entrar / Cadastrar 👤</button>
        <button onclick="toggleCart()" class="flex items-center gap-2 hover:scale-110 transition relative">
            🛒 <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
    </div>
</div>
</header>

<main class="w-full max-w-screen-2xl mx-auto px-4 sm:px-6 py-10">
    <h1 class="text-5xl font-bold text-center mb-4 text-slate-800">Celulares Importados</h1>
    <p class="text-center text-slate-600 mb-12 text-lg">Os melhores preços do mercado com qualidade premium</p>

    <div class="mb-16">
        <h2 class="text-4xl font-bold mb-2 text-slate-800">Recomendados para você</h2>
        <div id="recomendados-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
    </div>

    <h2 class="text-3xl font-bold mb-6 text-slate-800">Todos os Celulares</h2>
    <div id="produtos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
</main>

<!-- MODAL DO PRODUTO -->
<div id="product-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onclick="if(event.target === this) closeProductModal()">
    <div class="bg-white rounded-3xl w-full max-w-lg max-h-[95vh] overflow-y-auto relative" onclick="event.stopImmediatePropagation()">
        <button onclick="closeProductModal()" class="absolute top-5 right-5 text-4xl">×</button>
        <div class="p-6">
            <h2 id="modal-nome" class="text-2xl font-bold mb-4"></h2>
            <div class="bg-slate-50 rounded-2xl p-4 mb-6 flex justify-center min-h-[300px]">
                <img id="modal-imagem" class="max-h-[380px] w-full object-contain" alt="Celular">
            </div>
            <p id="modal-descricao" class="text-slate-600 mb-6 leading-relaxed"></p>

            <div class="mb-6">
                <p class="font-semibold mb-3 text-slate-700">Armazenamento</p>
                <div id="storage-options" class="flex flex-wrap gap-3"></div>
            </div>
            <div class="mb-8">
                <p class="font-semibold mb-3 text-slate-700">Cor</p>
                <div id="color-options" class="flex gap-4"></div>
            </div>

            <div class="flex justify-between items-center pt-4 border-t">
                <div>
                    <span class="text-sm text-slate-500">Preço</span>
                    <p id="modal-preco" class="text-3xl font-bold text-[#00bfff]"></p>
                </div>
                <button onclick="adicionarAoCarrinho()" class="px-10 py-4 bg-gradient-to-r from-[#00bfff] to-[#ff69b4] text-white font-semibold rounded-3xl">
                    Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </div>
</div>

<!-- CARRINHO -->
<div id="cart-drawer" class="hidden fixed inset-0 bg-black/70 z-[150] flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col relative">
        <button onclick="toggleCart()" class="absolute top-5 right-5 text-4xl">×</button>
        <div class="px-6 py-5 border-b"><h3 class="text-2xl font-bold">Seu Carrinho</h3></div>
        <div id="cart-items" class="flex-1 overflow-auto p-6 space-y-6"></div>
        <div class="p-6 border-t">
            <div class="space-y-3 mb-6">
                <div class="flex justify-between"><span class="text-slate-600">Subtotal</span><span id="subtotal">R$ 0,00</span></div>
                <div class="flex justify-between"><span class="text-slate-600">Frete</span><span class="text-green-600">R$ 15,00</span></div>
                <div class="flex justify-between text-xl font-bold border-t pt-4">
                    <span>Total</span><span id="cart-total" class="text-[#00bfff]">R$ 0,00</span>
                </div>
            </div>
            <button onclick="showCheckoutModal()" class="w-full py-6 bg-gradient-to-r from-[#00bfff] to-[#ff69b4] text-white font-semibold text-xl rounded-3xl">
                Finalizar Compra
            </button>
        </div>
    </div>
</div>

<!-- Pagamento MODAL -->
<div id="checkout-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[200] p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg max-h-[95vh] overflow-y-auto">
        <div class="p-8">
            <h2 class="text-3xl font-bold mb-6">Finalizar Compra</h2>
            
            <div class="mb-8">
                <p class="font-semibold mb-4 text-slate-700">Método de Pagamento</p>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="selectPaymentMethod('pix')" id="btn-pix" class="border-2 border-[#00bfff] bg-blue-50 rounded-2xl p-6 text-center hover:scale-105">
                        📱 PIX
                    </button>
                    <button onclick="selectPaymentMethod('cartao')" id="btn-cartao" class="border-2 border-slate-200 rounded-2xl p-6 text-center hover:scale-105">
                        💳 Cartão de Crédito
                    </button>
                </div>
            </div>

            <div id="cartao-form" class="hidden space-y-4 mb-8">
                <input type="text" id="numero-cartao" maxlength="19" placeholder="0000 0000 0000 0000" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="validade-cartao" placeholder="MM/AA" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                    <input type="text" id="cvv-cartao" maxlength="4" placeholder="CVV" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                </div>
                <input type="text" id="nome-cartao" placeholder="Nome completo no cartão" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
            </div>

            <div class="mb-8">
                <p class="font-semibold mb-3 text-slate-700">Endereço de Entrega</p>
                <textarea id="endereco-entrega" rows="3" placeholder="Rua, número, bairro, cidade, CEP..." class="w-full px-4 py-3 border border-slate-300 rounded-2xl"></textarea>
            </div>

            <div class="flex justify-between items-center text-2xl font-bold mb-8">
                <span>Total</span>
                <span id="modal-total" class="text-[#00bfff]">R$ 0,00</span>
            </div>

            <button onclick="confirmarPagamento()" class="w-full py-6 bg-gradient-to-r from-[#00bfff] to-[#ff69b4] text-white font-semibold text-xl rounded-3xl">
                Confirmar Pagamento
            </button>
            <button onclick="closeCheckoutModal()" class="mt-4 w-full text-slate-500 hover:text-slate-700">Voltar</button>
        </div>
    </div>
</div>

// ==================== VARIÁVEIS GLOBAIS ====================
let carrinho = [];
let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
let usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado')) || null;

let produtoSelecionado = null;
let corSelecionada = null;
let armazenamentoSelecionado = null;
let paymentMethod = 'pix';

// ==================== AUTH FUNCTIONS ====================
function showAuthModal() {
    document.getElementById('auth-modal').classList.remove('hidden');
    switchTab(0);
}
function closeAuthModal() {
    document.getElementById('auth-modal').classList.add('hidden');
}
function switchTab(tab) {
    const login = document.getElementById('login-form');
    const register = document.getElementById('register-form');
    if (tab === 0) {
        login.classList.remove('hidden'); register.classList.add('hidden');
    } else {
        login.classList.add('hidden'); register.classList.remove('hidden');
    }
}
function fazerCadastro() { alert("Função de cadastro - implemente se quiser"); closeAuthModal(); }
function fazerLogin() { alert("Função de login - implemente se quiser"); closeAuthModal(); }
function atualizarAuthButton() {
    const btn = document.getElementById('auth-button');
    if (usuarioLogado) btn.textContent = `Olá, ${usuarioLogado.nome}`;
    else btn.textContent = "Entrar / Cadastrar 👤";
}

// ==================== CARRINHO ====================
function toggleCart() {
    const drawer = document.getElementById('cart-drawer');
    drawer.classList.toggle('hidden');
    if (!drawer.classList.contains('hidden')) renderCarrinho();
}

function renderCarrinho() {
    const container = document.getElementById('cart-items');
    let html = '', subtotal = 0;

    if (carrinho.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-16">Seu carrinho está vazio.</p>`;
        document.getElementById('subtotal').textContent = 'R$ 0,00';
        document.getElementById('cart-total').textContent = 'R$ 15,00';
        return;
    }

    carrinho.forEach((item, i) => {
        subtotal += item.preco;
        html += `
            <div class="flex gap-4 border-b pb-6">
                <img src="${item.imagem}" class="w-20 h-20 object-contain rounded-2xl bg-slate-100">
                <div class="flex-1">
                    <p class="font-medium">${item.nome}</p>
                    <p class="text-sm text-slate-500">${item.cor} • ${item.armazenamento}</p>
                    <p class="font-bold text-[#00bfff]">R$ ${item.preco.toLocaleString('pt-BR')}</p>
                </div>
                <button onclick="removerDoCarrinho(${i})" class="text-red-500 text-3xl">×</button>
            </div>`;
    });

    container.innerHTML = html;
    document.getElementById('subtotal').textContent = `R$ ${subtotal.toLocaleString('pt-BR')}`;
    document.getElementById('cart-total').textContent = `R$ ${(subtotal + 15).toLocaleString('pt-BR')}`;
}

function removerDoCarrinho(index) {
    carrinho.splice(index, 1);
    renderCarrinho();
    atualizarContadorCarrinho();
}

function adicionarAoCarrinho() {
    if (!corSelecionada || !armazenamentoSelecionado) return alert("Escolha cor e armazenamento!");
    
    carrinho.push({
        id: Date.now(),
        nome: produtoSelecionado.nome,
        cor: corSelecionada.nome,
        armazenamento: armazenamentoSelecionado.tamanho,
        preco: armazenamentoSelecionado.preco,
        imagem: corSelecionada.imagem
    });
    alert("Produto adicionado ao carrinho!");
    closeProductModal();
    atualizarContadorCarrinho();
}

function atualizarContadorCarrinho() {
    document.getElementById('cart-count').textContent = carrinho.length;
}

// ==================== CHECKOUT ====================
function showCheckoutModal() {
    if (carrinho.length === 0) return alert("Carrinho vazio!");
    document.getElementById('cart-drawer').classList.add('hidden');
    document.getElementById('checkout-modal').classList.remove('hidden');
    selectPaymentMethod('pix');
    atualizarTotalModal();
}

function closeCheckoutModal() {
    document.getElementById('checkout-modal').classList.add('hidden');
}

function selectPaymentMethod(method) {
    paymentMethod = method;
    document.getElementById('btn-pix').classList.toggle('border-[#00bfff]', method === 'pix');
    document.getElementById('btn-pix').classList.toggle('bg-blue-50', method === 'pix');
    document.getElementById('btn-cartao').classList.toggle('border-[#00bfff]', method === 'cartao');
    document.getElementById('cartao-form').classList.toggle('hidden', method !== 'cartao');
}

function atualizarTotalModal() {
    const total = carrinho.reduce((acc, item) => acc + item.preco, 0) + 15;
    document.getElementById('modal-total').textContent = `R$ ${total.toLocaleString('pt-BR')}`;
}

function confirmarPagamento() {
    const endereco = document.getElementById('endereco-entrega').value.trim();
    if (!endereco) return alert("Informe o endereço de entrega!");

    const total = carrinho.reduce((acc, item) => acc + item.preco, 0) + 15;
    alert(`✅ Compra finalizada com sucesso!\nTotal: R$ ${total.toLocaleString('pt-BR')}\nPagamento: ${paymentMethod.toUpperCase()}`);

    carrinho = [];
    atualizarContadorCarrinho();
    closeCheckoutModal();
}

// ==================== MODAL PRODUTO ====================
function abrirModalProduto(id) {
    produtoSelecionado = produtos.find(p => p.id === id);
    if (!produtoSelecionado) return;

    document.getElementById('modal-nome').textContent = produtoSelecionado.nome;
    document.getElementById('modal-descricao').textContent = produtoSelecionado.descricao;
    document.getElementById('modal-imagem').src = produtoSelecionado.cores[0].imagem;

    let storageHTML = '';
    produtoSelecionado.armazenamento.forEach((item, i) => {
        storageHTML += `<button onclick="selecionarArmazenamento(this, ${i})" class="storage-btn border-2 border-slate-300 px-6 py-3 rounded-2xl font-medium">${item.tamanho}</button>`;
    });
    document.getElementById('storage-options').innerHTML = storageHTML;

    let colorHTML = '';
    produtoSelecionado.cores.forEach((cor, i) => {
        colorHTML += `<div onclick="selecionarCor(this, ${i})" class="color-circle" style="background-color: ${cor.cor};"></div>`;
    });
    document.getElementById('color-options').innerHTML = colorHTML;

    selecionarArmazenamento(document.querySelector('.storage-btn'), 0);
    selecionarCor(document.querySelector('.color-circle'), 0);

    document.getElementById('product-modal').classList.remove('hidden');
}

function closeProductModal() {
    document.getElementById('product-modal').classList.add('hidden');
}

function selecionarCor(el, index) {
    document.querySelectorAll('.color-circle').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    corSelecionada = produtoSelecionado.cores[index];
    document.getElementById('modal-imagem').src = corSelecionada.imagem;
}

function selecionarArmazenamento(el, index) {
    document.querySelectorAll('.storage-btn').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    armazenamentoSelecionado = produtoSelecionado.armazenamento[index];
    document.getElementById('modal-preco').textContent = `R$ ${armazenamentoSelecionado.preco.toLocaleString('pt-BR')}`;
}

// ==================== RENDER ====================
function renderProdutos() {
    const container = document.getElementById('produtos-grid');
    let html = '';
    produtos.forEach(p => {
        html += `
            <div onclick="abrirModalProduto(${p.id})" class="product-card bg-white rounded-3xl overflow-hidden shadow cursor-pointer">
                <img src="${p.imagemBase}" class="w-full h-64 object-contain p-4">
                <div class="p-6">
                    <h3 class="font-bold text-lg">${p.nome}</h3>
                    <p class="text-sm text-slate-500 line-clamp-2 my-2">${p.descricao}</p>
                    <p class="text-2xl font-bold text-[#00bfff] mt-3">R$ ${p.precoBase.toLocaleString('pt-BR')}</p>
                </div>
            </div>`;
    });
    container.innerHTML = html;
}

function renderRecomendadosPersonalizados() {
    const container = document.getElementById('recomendados-grid');
    let html = '';
    produtos.slice(0, 3).forEach(p => {
        html += `
            <div onclick="abrirModalProduto(${p.id})" class="product-card bg-white rounded-3xl overflow-hidden shadow cursor-pointer">
                <img src="${p.imagemBase}" class="w-full h-56 object-contain p-6">
                <div class="p-6">
                    <h3 class="font-bold text-lg">${p.nome}</h3>
                    <p class="text-2xl font-bold text-[#00bfff] mt-3">R$ ${p.precoBase.toLocaleString('pt-BR')}</p>
                </div>
            </div>`;
    });
    container.innerHTML = html;
}

// Inicialização
window.onload = () => {
    renderProdutos();
    renderRecomendadosPersonalizados();
    atualizarAuthButton();
};
</script>
